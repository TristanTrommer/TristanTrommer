version: 2

# Updates land on preview, where the PR checks run before the merge and the
# preview deploy after it. Minor and patch bumps come as one grouped PR.
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    target-branch: 'preview'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 5
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # `typescript` is the TS 6 alias (@typescript/typescript6) that `next build`
      # uses; `tsc` is TS 7 (@typescript/native).
      - dependency-name: 'typescript'
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    # "/" covers .github/workflows only; the composite action pins its own.
    directories: ['/', '/.github/actions/*']
    target-branch: 'preview'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns: ['*']
